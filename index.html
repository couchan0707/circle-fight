<style>

#ctl3.pu{background:rgba(244,208,104,.55);border-radius:20px;padding:2px 10px;animation:pu 1s infinite}@keyframes pu{50%{box-shadow:0 0 0 8px rgba(244,208,104,.8)}}#ctl3 input{flex:1;height:40px;accent-color:var(--r)}

.big:active{transform:translateY(2px)}
h3{margin:16px 0 4px}.seg{display:flex;gap:8px}.seg .b{flex:1}

html,body{background:#17141a;color:#EDE3CC;font-family:"Courier New","Noto Sans TC",monospace}#top{background:repeating-linear-gradient(90deg,#2b1f18 0 14px,#33261d 14px 28px);border-bottom:3px solid #C9A24A}.b{background:#3a3340;color:#F4E7C5;border:2px solid #C9A24A;border-radius:6px;box-shadow:0 3px 0 #0e0c10}.b.on{background:#C9A24A;color:#17141a}#tip{background:#0f0d12;color:#F4D068;border:3px solid #C9A24A;border-radius:6px}canvas{background:#17141a;border-radius:6px;box-shadow:0 0 0 3px #C9A24A,0 6px 20px #000;image-rendering:pixelated}#menu{background:#17141a}.card{background:#241f29;border:3px solid #C9A24A;border-radius:8px;color:#EDE3CC}.sub{color:#b9a98a}.big{border-radius:6px;border:2px solid #C9A24A}#msg{background:rgba(0,0,0,.7)}
#sc{display:none}.glow{background:linear-gradient(90deg,#C9A24A,#FFE45A,#C9A24A,#7FE0E8,#C9A24A);background-size:300% 100%;animation:gl 3s linear infinite;color:#17141a!important}@keyframes gl{to{background-position:300% 0}}.lock{background:#3a3340!important;color:#7a7080!important}#top{justify-content:center}#tip{text-align:center}#gear{min-width:48px}.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.sd{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border:2px solid #C9A24A;margin:0 3px;background:#5a5260;color:#17141a;font-weight:800}.sd.cu{background:#F4D068}.sd.dn{background:#9BBF9F}.sl{color:#b9a98a;margin-right:8px;font-weight:700}.sp{padding:3px 10px;color:#fff;margin-left:8px;font-weight:800}#stp{white-space:nowrap}</style></head><body>

<script>
const W=800,H=450,CY=225,R=120,TRAY=450,U=20;let CX=400;
const C={ink:'#3D342E',c:'#D96B27',r:'#5A8F76',d:'#4A7B9D',y:'#F4D068',wood:'#EFE8DC'};
const cv=document.getElementById('cv'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const tip=$('tip'),wrap=$('wrap'),ctl3=$('ctl3'),sl=$('sl'),menu=$('menu'),msg=$('msg');
cv.width=W*2;cv.height=H*2;
const S={mode:'story',iep:'pic',voice:false,lv:0,err:0,pieces:[],t:0,parts:[],hint:null,snap:null,drag:null,busy:0,trans:null};
const MA={x:95,y:205},MB={x:605,y:205};
const L1=['screw','rubber','radius','diameter'];
const T1=['第一步：把「圓心螺絲」拖到輪子正中間鎖緊！','第二步：把「圓周橡膠皮」套在輪子最外圈！','第三步：安裝一根「半徑」鋼樑：從圓心連到圓周。','第四步：安裝一根「直徑」鋼樑：穿過圓心，連到兩邊圓周。'];
/* ---------- 音效 ---------- */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,to,delay=0){try{const a=ac(),o=a.createOscillator(),n=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(MST());o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,f=2000,v=.15,type='bandpass',delay=0){try{const a=ac(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),gn=a.createGain(),t=a.currentTime+delay;s.buffer=b;fl.type=type;fl.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(gn).connect(MST());s.start(t)}catch(e){}}
const SFX={pick:()=>noise(.1,500,.15),click:()=>{tone(1200,.04,'square',.1);tone(700,.06,'square',.1,0,.06)},weld:()=>{for(let i=0;i<8;i++)noise(.06,5000,.12,'highpass',i*.09)},saw:()=>{tone(200,.7,'sawtooth',.08,110);noise(.7,2500,.07)},burn:()=>noise(.18,3500,.05,'highpass'),bell:()=>[1047,1319,1568,2093,2637].forEach((f,i)=>tone(f,.7,'sine',.11,0,i*.12)),err:()=>{tone(150,.15,'sine',.22);tone(130,.22,'sine',.22,0,.2)},ding:()=>tone(1760,.5,'sine',.22),engine:()=>{for(let i=0;i<8;i++)tone(70+(i%2)*10,.14,'square',.07,0,i*.28)}};
/* ---------- 語音 ---------- */
function togVoice(){S.voice=!S.voice;$('vb').textContent=S.voice?'🔊 播放語音':'🔇 靜音中';$('vb').classList.toggle('on',S.voice);if(S.voice)speak(S.vt||tip.textContent);else if(window.speechSynthesis)speechSynthesis.cancel()}
tip.onclick=()=>speak(S.vt||tip.textContent);
function fs(){try{const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}}
function home(){updMenu();$('lb')&&($('lb').innerHTML=lbAll());S.lv=0;S.trans=null;menu.hidden=false;msg.hidden=true;ctl3.hidden=true;S.pieces=[];if(window.speechSynthesis)speechSynthesis.cancel();tip.textContent='請從主選單選擇關卡'}
/* ---------- 繪圖 ---------- */
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,7)}
function forest(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#9A9C92');gr.addColorStop(1,'#757A6C');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){const x=i*62+20,h=70+(i*37%50);g.fillStyle=i%2?'#5E6558':'#6B7262';g.beginPath();g.moveTo(x,TRAY-20);g.lineTo(x+28,TRAY-20-h);g.lineTo(x+56,TRAY-20);g.fill()}
 g.fillStyle='rgba(180,180,170,.35)';[[120,70],[400,40],[650,90]].forEach(a=>{g.beginPath();g.ellipse(a[0],a[1],90,26,0,0,7);g.fill()});g.fillStyle='#8A8D7E';g.fillRect(0,TRAY-20,W,20)}
function car(x,y,rot){g.fillStyle='#A8684A';rr(x-80,y-50,160,50,14);g.fill();g.fillStyle='#C98F6E';rr(x-45,y-85,95,40,12);g.fill();g.fillStyle='#CFE3EA';rr(x-35,y-78,32,28,6);g.fill();rr(x+7,y-78,32,28,6);g.fill();
 [-45,50].forEach(dx=>{g.save();g.translate(x+dx,y);g.rotate(rot);g.fillStyle='#2a2428';circ(0,0,24);g.fill();g.fillStyle='#CBBFA9';circ(0,0,12);g.fill();g.strokeStyle='#2a2428';g.lineWidth=3;for(let k=0;k<4;k++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(-12,0);g.lineTo(12,0);g.stroke()}g.restore()})}
function dTrans(){const T=S.trans,e=T.e,eo=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2,off=Math.max(0,Math.min(1,(e-.25)/.7)),o=(off<.5?2*off*off:1-Math.pow(-2*off+2,2)/2)*W;
 g.save();g.translate(-o,0);garage();g.restore();g.save();g.translate(W-o,0);forest();g.restore();
 const bob=e>.25?Math.sin(S.t*20)*2:0;car(330,TRAY-35+bob,S.t*(e>.25?14:0));
 if(e<.3){g.save();const gr=g.createRadialGradient(375,TRAY-35,5,375,TRAY-35,110);gr.addColorStop(0,'rgba(244,208,104,.9)');gr.addColorStop(1,'rgba(244,208,104,0)');g.fillStyle=gr;g.fillRect(200,200,360,260);g.restore();txt('✨ 輪胎鎖緊發出金光！',400,90,30,C.ink)}
 else if(e<.85)txt('噗噗——！探測車出發！',400,90,30,C.ink);else txt('🌲 污染森林到了！',400,90,30,'#fff')}
/* ===== v2 資源班版 ===== */
const NW=[6,4,5];
function mkp(a){return a.map(p=>({...p,hx:p.x,hy:p.y}))}
const inM=(p,M)=>Math.abs(p.x-M.x)<85&&Math.abs(p.y-M.y)<95;
function newTire(R){S.R=R;S.cy=S.lv==2?205:225;S.tx=-W;S.rot=0;S.ts='in';S.step=0;S.done=S.lv==2?{screw:1,rubber:1}:{};S.bm=null;S.err=0;S.hint=null;S.busy=1;S.fm='';S.rb=0;S.anim=null}
function tip1(){const n=S.need=='radius'?'半徑':'直徑';say(['① 鎖圓心','② 套圓周','③ 裝'+n,'④ 鎖端點'][S.step],['把圓心螺絲，鎖在輪胎正中間','把橡膠皮，套在輪胎最外圈','把'+n+'鋼樑裝上去。'+(S.need=='radius'?'一端在圓心，另一端在圓周':'穿過圓心，兩端都在圓周'),'點一點發亮的螺絲'][S.step])}
function tip2(){const r=S.need=='radius';say(['① 進'+(r?'切割機':'焊接機'),'② 裝上輪胎','③ 鎖端點'][S.step],[r?'現在需要半徑，但只有一根直徑。請把直徑拖進右邊的「切割機」切成兩半吧！':'現在需要直徑，請把半徑依序拖進左邊的「焊接機」焊成一根吧！','請把剛做好的零件拖到輪胎上組裝吧！','點一點發亮的螺絲'][S.step])}
function spark(x,y,c,n=10){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function drop2(p){const A=inM(p,MA),B=inM(p,MB);
 if(S.step==0){if(!A&&!B){p.back=1;return}if(B&&p.k=='diameter')cut(p);else if(A&&p.k=='radius'&&S.wl<2){p.placed=1;p.slot=S.wl++;SFX.click();gain(MA.x,MA.y);if(S.wl==2)weld()}else wrong(p);return}
 if(S.step==1){if(p.k==S.need&&okB(p)){snapB(p);good();S.step=2;tip2()}else if(p.k!=S.need&&Math.abs(p.y-S.cy)<130&&Math.abs(p.x-CX)<S.R+100)wrong(p);else p.back=1}}
function cut(p){gain(MB.x,MB.y);p.placed=1;S.busy=1;S.hint=null;S.anim={t:0};SFX.saw();say('鋸——！');setTimeout(()=>S.lv==2&&out([{k:'radius',len:S.R,x:CX-100},{k:'radius',len:S.R,x:CX+100}],S.v+' ÷ 2 = '+S.v/2),900)}
function weld(){S.busy=1;S.hint=null;S.anim={t:0};SFX.weld();say('滋滋！');setTimeout(()=>S.lv==2&&out([{k:'diameter',len:2*S.R,x:CX}],S.v/2+' × 2 = '+S.v),1000)}
function goTrans(){S.lv=9;S.trans={t:0,e:0};msg.hidden=true;ctl3.hidden=true;S.pieces=[];say('🚗 出發！','輪胎鎖緊了！探測車出發，前往森林！')}
/* 關卡 3 */
sl.oninput=()=>{S.r=+sl.value;SFX.pick();if(!S.said){S.said=1;ctl3.classList.remove('pu');say('② 轉一圈','抓住黃色圓點，轉一整圈')}};
function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a}
/* 繪圖 */
function bcol(k){return k=='radius'?C.r:C.d}
function needP(p){return S.lv==1?p.k==['screw','rubber',S.need][S.step]:S.step<2}
let last=performance.now();
/* ===== v3 漸進鷹架 + 魔王戰 ===== */
const L3=()=>S.lv==3||S.lv==4,EN=a=>a<.5?2*a*a:1-Math.pow(-2*a+2,2)/2;
SFX.bell=()=>[523,659,784,1047,1319,1568,2093,2637].forEach((f,i)=>{tone(f,.9,'sine',.09,0,i*.07);tone(f*1.5,.6,'sine',.04,0,i*.07+.03)});
SFX.rub=()=>{tone(260,.12,'sine',.25,520);noise(.12,400,.1,'lowpass');tone(520,.09,'sine',.18,250,.13)};
SFX.beamS=()=>{tone(1650,.3,'triangle',.16);tone(1050,.45,'triangle',.16,0,.14)};
SFX.ratchet=()=>{for(let i=0;i<3;i++){tone(900,.03,'square',.08,0,i*.08);noise(.03,3000,.05,'highpass',i*.08)}tone(1500,.1,'square',.13,0,.28)};
SFX.done=()=>{tone(880,.15,'sine',.2);tone(1320,.3,'sine',.2,0,.15)};
SFX.rumble=()=>{for(let i=0;i<5;i++)noise(.5,100+i*20,.25,'lowpass',i*.4)};
const HV=[['要先鎖圓心喔！','要套上橡膠皮喔！','要裝上鋼樑喔！','要點一點螺絲喔！'],['要用機器做零件喔！','要把零件拖到輪胎上喔！','要點一點螺絲喔！']];
function wrong(p){if(p)p.back=1;S.combo=0;S.errTot=(S.errTot||0)+1;if(S.lv<3)hurtPlayer();S.terr=(S.terr||0)+1;S.err++;if(S.err==4)speak(S.lv==1?HV[0][S.step]:S.lv==2?HV[1][S.step]:'拉長半徑！')}
function drop1(p){const n=['screw','rubber',S.need][S.step];if(p.k!=n){wrong(p);return}const d=Math.hypot(p.x-CX,p.y-S.cy);
 if(p.k=='screw'&&d<45||p.k=='rubber'&&d<S.R+70){p.placed=1;S.done[p.k]=1}else if(p.k!='screw'&&p.k!='rubber'&&okB(p))snapB(p);else{p.back=1;return}
 good(p.k);S.step++;tip1()}
function fin(){S.busy=1;tireBonus();setTimeout(()=>{if(S.lv>2)return;SFX.done();S.pieces=S.pieces.filter(q=>q==S.bm);S.fm='';S.ts='out'},600)}
function start(lv){CX=lv<3?350:400;S.lv=lv;initRun(lv);S.err=0;S.hint=null;S.busy=0;S.drag=null;S.trans=null;S.parts=[];S.fl=[];S.cf=[];S.wave=0;S.flash=0;S.ts='';S.bm=null;S.ok=0;S.anim=null;S.pieces=[];S.ent=1;S.final=0;menu.hidden=true;msg.hidden=true;ctl3.hidden=true;if(lv==1)w1();if(lv==2)w2();if(lv==3)w3();if(lv==4)wB();rs()}

 `<div class="sg">${sw('🔊 語音',S.voice,'togVoice()')}${sw('⏱️ 顯示計時',!S.hideT,'togTimer()')}${sw(S.iep=='num'?'🔢 數值模式':'🖼️ 純圖像模式',S.iep=='num',"setIep(S.iep=='pic'?'num':'pic')")}${sw('⏱️ 時間加成',S.tb,'S.tb=S.tb?0:1')}${sw('🌙 低刺激模式',S.low,'S.low=S.low?0:1')}<button class="b" onclick="fs()">⤢ 全螢幕</button></div>`+
 `<div style="margin:6px 0">🔉 音量 <input type="range" min="0" max="100" value="${Math.round(S.vol*100)}" oninput="S.vol=this.value/100;if(MG)MG.gain.value=S.vol" onchange="saveSet()" style="width:60%;vertical-align:middle"></div>`+
 `<div style="border-top:2px solid #C9A24A;margin-top:8px;padding-top:6px;font-size:14px">👩‍🏫 教師區</div><div class="sg">${sw(isUnl()?'🔓 生存挑戰：已解鎖':'🔒 生存挑戰：鎖定',isUnl(),'tUnl()')}<button class="b" onclick="clrLB(this)">🗑️ 清除排行榜</button></div>`}

function clampAng(b,a){const o=b.ang;b.ang=a;if(inB(fe(b)))return a;for(let d=.05;d<3.2;d+=.05)for(const s of[1,-1]){b.ang=a+s*d;if(inB(fe(b))){const r=b.ang;b.ang=o;return r}}b.ang=o;return o}
function fixBeam(){const b=S.bm;if(b&&b.st<2&&!S.fd&&!inB(fe(b)))b.ang=clampAng(b,b.ang)}
function endHandle(){const b=S.bm;if(!b||b.st!=1||S.ts!='idle')return;const f=fe(b),k=Math.sin(S.t*6)*.5+.5;g.save();g.strokeStyle=`rgba(255,255,255,${.6+.4*k})`;g.lineWidth=3;circ(f.x,f.y,16+3*k);g.stroke();g.fillStyle='#fff';circ(f.x,f.y,4);g.fill();g.restore()}
